<!doctype html>
<meta charset="utf-8">
<title>Ieum — WebMCP smoke test</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  #out { white-space: pre-wrap; background: #f6f6f6; padding: 1rem; border-radius: 6px; }
  .ok   { color: #0a7c2f; font-weight: 600; }
  .bad  { color: #c0271d; font-weight: 600; }
  .warn { color: #a06000; font-weight: 600; }
</style>

<h1>Ieum — WebMCP smoke test</h1>
<p>Chrome 149+ with <code>chrome://flags/#enable-webmcp-testing</code>, or the ChatGPT desktop in-app browser.</p>
<div id="out">running…</div>
<p>Then ask the agent: <b>“What tools does this page provide? Call the route tool from entrance to 12A.”</b></p>

<script type="module">
const out = document.getElementById('out');
const log = [];
const put = (label, verdict, detail = '') => {
  const cls = verdict === true ? 'ok' : verdict === false ? 'bad' : 'warn';
  const mark = verdict === true ? 'PASS' : verdict === false ? 'FAIL' : 'INFO';
  log.push(`<span class="${cls}">[${mark}]</span> ${label}${detail ? ' — ' + detail : ''}`);
  out.innerHTML = log.join('\n');
};

// 0. What browser is this, actually? The most common cause of a missing
//    modelContext is simply not being in a build that ships it.
const ua = navigator.userAgent;
const chromeVer = (ua.match(/Chrome\/(\d+)/) || [])[1];
const isEdge = /Edg\//.test(ua);

put('browser', null, ua);
if (!chromeVer) {
  put('Chrome build', false, 'Not Chrome/Chromium. WebMCP ships in Chrome 149+ or the ChatGPT desktop in-app browser.');
} else if (isEdge) {
  put('Chrome build', false, `Edge ${chromeVer} detected. Use Chrome 149+ \u2014 the testing flag is Chrome-only.`);
} else if (Number(chromeVer) < 149) {
  put('Chrome build', false, `Chrome ${chromeVer} is older than 149. Update Chrome.`);
} else {
  put('Chrome build', true, `Chrome ${chromeVer}`);
}

// 1. secure context
put('secure context', window.isSecureContext, `isSecureContext=${window.isSecureContext}`);

// 2. document.modelContext present?
const mc = document.modelContext;
put('document.modelContext', typeof mc?.registerTool === 'function',
    mc ? `keys: ${Object.getOwnPropertyNames(Object.getPrototypeOf(mc)).join(', ')}` : 'undefined');

// 2b. is the old navigator surface still around?
put('navigator.modelContext (legacy)', null,
    typeof navigator.modelContext === 'undefined' ? 'undefined (expected)' : 'ALSO PRESENT');

if (typeof mc?.registerTool === 'function') {
  const controller = new AbortController();
  let sawPerCallSignal = null;

  // 3. dotted tool name — the open question in PRD §7.1
  try {
    await mc.registerTool({
      name: 'a11y.get_route',
      description: 'Return the walking route between two points in the seating layout. ' +
                   'from/to accept a seat ref like "12A" or a landmark key like "entrance".',
      inputSchema: {
        type: 'object',
        properties: {
          from: { type: 'string', description: 'Seat ref or landmark key' },
          to:   { type: 'string', description: 'Seat ref or landmark key' }
        },
        required: ['from', 'to']
      },
      annotations: { readOnlyHint: true },
      execute: async (input, opts) => {
        sawPerCallSignal = opts && 'signal' in opts;
        put('execute() called by agent', true, `input=${JSON.stringify(input)}`);
        put('execute receives per-call signal', sawPerCallSignal, `opts keys: ${opts ? Object.keys(opts).join(',') : 'none'}`);
        return { content: [{ type: 'text', text: JSON.stringify({
          from: input.from, to: input.to,
          totalLength_m: 7.3,
          segments: [{ pathway_mode: 'walkway', length_m: 7.3, direction: 'backward' }],
          rendered: { summary: 'Walk 24 feet back along the aisle, passing 6 rows. Window seat on your left.' }
        }) }] };
      }
    }, { signal: controller.signal });
    put('registerTool with dotted name "a11y.get_route"', true);
  } catch (e) {
    put('registerTool with dotted name "a11y.get_route"', false, `${e.name}: ${e.message}`);
    // fallback: underscore
    try {
      await mc.registerTool({
        name: 'a11y_get_route',
        description: 'Fallback underscore-named tool.',
        inputSchema: { type: 'object', properties: {}, },
        annotations: { readOnlyHint: true },
        execute: async () => ({ content: [{ type: 'text', text: 'ok' }] })
      }, { signal: controller.signal });
      put('registerTool with underscore name "a11y_get_route"', true, 'USE UNDERSCORE NAMING');
    } catch (e2) {
      put('registerTool with underscore name', false, `${e2.name}: ${e2.message}`);
    }
  }

  // 4. annotations accepted?
  put('annotations.readOnlyHint accepted', true, 'no throw on registration');

  put('waiting for an agent to call the tool…', null,
      'Open this page in ChatGPT desktop in-app browser (or use the Model Context Tool Inspector extension) and ask it to call the route tool.');

  window.__ieumAbort = () => { controller.abort(); put('controller.abort() — tool unregistered', true); };
} else {
  put('cannot continue', false, 'document.modelContext.registerTool is not available here');
  const why = !chromeVer
    ? 'You are not in Chrome. Open this page in Chrome 149+, or in the ChatGPT desktop app\u2019s in-app browser.'
    : Number(chromeVer) < 149
      ? `Chrome ${chromeVer} is older than 149. Update Chrome, then enable the flag.`
      : 'Chrome is new enough, so the flag is almost certainly not active. Open chrome://flags/#enable-webmcp-testing, set it to Enabled, then press the Relaunch button at the bottom of that page. Closing and reopening the window is not always enough.';
  put('what to do', null, why);
}
</script>
